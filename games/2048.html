<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>2048 - Volt Report</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      background: #faf8ef;
      color: #776e65;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    h1 { font-size: 2.2rem; font-weight: 700; color: #776e65; margin: 8px 0; }
    .score-box {
      background: #bbada0;
      color: #fff;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 12px;
    }
    #canvas {
      background: #bbada0;
      border-radius: 8px;
      display: block;
      max-width: 100%;
      touch-action: none;
    }
    .controls {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: #8f7a66;
      color: #f9f6f2;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    button:active { background: #9f8b77; }
    .hint { margin-top: 10px; font-size: 0.85rem; opacity: 0.8; text-align: center; }
    a.back { color: #8f7a66; margin-top: 16px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>2048</h1>
  <div class="score-box">Score: <span id="score">0</span></div>
  <canvas id="canvas" width="400" height="400"></canvas>
  <div class="controls">
    <button id="new">New Game</button>
  </div>
  <p class="hint">Swipe or use arrow keys</p>
  <a class="back" href="../games.html">← Back to Games</a>

  <script>
    const SIZE = 4;
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    let grid, score, touchStartX, touchStartY;

    function resize() {
      const s = Math.min(window.innerWidth - 24, 400);
      canvas.style.width = s + 'px';
      canvas.style.height = s + 'px';
    }
    window.addEventListener('resize', resize);
    resize();

    function emptyGrid() {
      return Array.from({length: SIZE}, () => Array(SIZE).fill(0));
    }

    function addRandom() {
      const empty = [];
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (grid[r][c] === 0) empty.push({r, c});
      if (empty.length === 0) return;
      const {r, c} = empty[Math.floor(Math.random() * empty.length)];
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function draw() {
      const cell = canvas.width / SIZE;
      const pad = 8;
      ctx.fillStyle = '#bbada0';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const colors = {
        0: '#cdc1b4', 2: '#eee4da', 4: '#ede0c8', 8: '#f2b179',
        16: '#f59563', 32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72',
        256: '#edcc61', 512: '#edc850', 1024: '#edc53f', 2048: '#edc22e'
      };

      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const v = grid[r][c];
          const x = c * cell + pad / 2;
          const y = r * cell + pad / 2;
          const w = cell - pad;
          ctx.fillStyle = colors[v] || '#3c3a32';
          roundRect(ctx, x, y, w, w, 6);
          ctx.fill();
          if (v) {
            ctx.fillStyle = v > 4 ? '#f9f6f2' : '#776e65';
            ctx.font = `bold ${v > 512 ? 28 : v > 64 ? 34 : 42}px Montserrat, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(v, x + w / 2, y + w / 2 + 2);
          }
        }
      }
      scoreEl.textContent = score;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function slide(row) {
      let arr = row.filter(v => v !== 0);
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          score += arr[i];
          arr[i + 1] = 0;
        }
      }
      arr = arr.filter(v => v !== 0);
      while (arr.length < SIZE) arr.push(0);
      return arr;
    }

    function move(dir) {
      const prev = JSON.stringify(grid);
      if (dir === 'left') {
        for (let r = 0; r < SIZE; r++) grid[r] = slide(grid[r]);
      } else if (dir === 'right') {
        for (let r = 0; r < SIZE; r++) grid[r] = slide(grid[r].slice().reverse()).reverse();
      } else if (dir === 'up') {
        for (let c = 0; c < SIZE; c++) {
          let col = [];
          for (let r = 0; r < SIZE; r++) col.push(grid[r][c]);
          col = slide(col);
          for (let r = 0; r < SIZE; r++) grid[r][c] = col[r];
        }
      } else if (dir === 'down') {
        for (let c = 0; c < SIZE; c++) {
          let col = [];
          for (let r = 0; r < SIZE; r++) col.push(grid[r][c]);
          col = slide(col.reverse()).reverse();
          for (let r = 0; r < SIZE; r++) grid[r][c] = col[r];
        }
      }
      if (JSON.stringify(grid) !== prev) {
        addRandom();
        draw();
      }
    }

    function init() {
      grid = emptyGrid();
      score = 0;
      addRandom();
      addRandom();
      draw();
    }

    document.getElementById('new').addEventListener('click', init);

    document.addEventListener('keydown', e => {
      const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
      if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
    });

    canvas.addEventListener('touchstart', e => {
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    }, {passive: true});

    canvas.addEventListener('touchend', e => {
      if (!touchStartX) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      const absX = Math.abs(dx), absY = Math.abs(dy);
      if (Math.max(absX, absY) < 30) return;
      if (absX > absY) move(dx > 0 ? 'right' : 'left');
      else move(dy > 0 ? 'down' : 'up');
      touchStartX = touchStartY = null;
    }, {passive: true});

    init();
  </script>
</body>
</html>
